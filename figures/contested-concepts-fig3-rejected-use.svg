<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#242321"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C65F38"/></marker>
</defs>
<rect width="1200" height="1200" fill="#FAFAF7"/>
<text x="60" y="95" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#C65F38">宗派の争いは、仏教の失敗なのか</text>
<text x="60" y="178" font-family="Noto Serif CJK JP" font-weight="bold" font-size="60" fill="#242321">退けた相手を、どう扱うか</text>
<text data-step="1" x="60" y="335" font-family="Noto Sans CJK JP" font-weight="bold" font-size="46" fill="#242321">低い段の認識</text>
<text data-step="1" x="60" y="392" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#242321">攻めと守り</text>
<rect data-step="2" x="400" y="280" width="250" height="130" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="2" x="525" y="361" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="46" fill="#242321">自分</text>
<rect data-step="2" x="890" y="280" width="250" height="130" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="2" x="1015" y="361" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="46" fill="#242321">相手</text>
<line data-step="3" x1="664" y1="345" x2="876" y2="345" stroke="#242321" stroke-width="5" marker-end="url(#ai)" marker-start="url(#ai)"/>
<text data-step="4" x="60" y="595" font-family="Noto Sans CJK JP" font-weight="bold" font-size="46" fill="#242321">二階の認識</text>
<text data-step="4" x="60" y="652" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#242321">批判者として残す</text>
<rect data-step="4" x="400" y="540" width="250" height="130" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="4" x="525" y="621" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="46" fill="#242321">自分</text>
<rect data-step="4" x="890" y="540" width="250" height="130" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="4" x="1015" y="621" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="46" fill="#242321">相手</text>
<line data-step="5" x1="876" y1="605" x2="664" y2="605" stroke="#C65F38" stroke-width="7" marker-end="url(#aa)"/>
<text data-step="5" x="770" y="578" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="42" fill="#C65F38">批判</text>
<text data-step="6" x="60" y="935" font-family="Noto Sans CJK JP" font-weight="bold" font-size="46" fill="#242321">教判</text>
<text data-step="6" x="60" y="992" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#242321">下の段に収める</text>
<rect data-step="6" x="400" y="780" width="740" height="130" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="6" x="770" y="861" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="46" fill="#242321">自分　上の段</text>
<rect data-step="7" x="400" y="1010" width="740" height="130" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="7" x="770" y="1091" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="46" fill="#242321">相手　下の段</text>
<line data-step="8" x1="560" y1="1002" x2="560" y2="952" stroke="#242321" stroke-width="5"/>
<line data-step="8" x1="515" y1="945" x2="605" y2="945" stroke="#C65F38" stroke-width="7"/>
<text data-step="8" x="640" y="977" font-family="Noto Sans CJK JP" font-weight="bold" font-size="40" fill="#C65F38">批判は届かない</text>
</svg>
