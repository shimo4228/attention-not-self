<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#242321"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C65F38"/></marker>
</defs>
<rect width="1200" height="1200" fill="#FAFAF7"/>
<text x="60" y="95" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#C65F38">宗派の争いは、仏教の失敗なのか</text>
<text x="60" y="178" font-family="Noto Serif CJK JP" font-weight="bold" font-size="60" fill="#242321">七つの条件を仏教に当てると</text>
<rect data-step="4" x="60" y="712" width="1080" height="84" rx="16" fill="none" stroke="#C65F38" stroke-width="7"/>
<text data-step="1" x="85" y="285" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">1　ほめる語である</text>
<text data-step="1" x="85" y="363" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">2　価値は込み入った全体に付く</text>
<text data-step="1" x="85" y="441" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">3　重みづけで描き方が分かれる</text>
<text data-step="1" x="85" y="519" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">4　開いている</text>
<text data-step="1" x="85" y="597" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">5　相手の基準をいくらか分かる</text>
<text data-step="1" x="85" y="675" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">6　全員が権威を認める手本</text>
<text data-step="1" x="85" y="768" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">7　競い合いが手本の達成を育てる</text>
<text data-step="2" x="1115" y="363" text-anchor="end" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">当てはまる</text>
<text data-step="2" x="1115" y="441" text-anchor="end" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">当てはまる</text>
<text data-step="2" x="1115" y="519" text-anchor="end" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">当てはまる</text>
<text data-step="2" x="1115" y="675" text-anchor="end" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">当てはまる</text>
<text data-step="3" x="1115" y="285" text-anchor="end" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">読む位置で変わる</text>
<text data-step="3" x="1115" y="597" text-anchor="end" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">読む位置で変わる</text>
<text data-step="4" x="1115" y="768" text-anchor="end" font-family="Noto Sans CJK JP" font-weight="bold" font-size="40" fill="#C65F38">深くぶつかる</text>
<text data-step="5" x="600" y="868" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="38" fill="#242321">いちばん疑わしい条件（この文章の読み）</text>
<rect data-step="5" x="60" y="900" width="470" height="210" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="5" x="295" y="982" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">キリスト教　条件5</text>
<text data-step="5" x="295" y="1050" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">争いは避けがたいのか</text>
<line data-step="6" x1="542" y1="1005" x2="658" y2="1005" stroke="#C65F38" stroke-width="7" marker-end="url(#aa)"/>
<rect data-step="7" x="670" y="900" width="470" height="210" rx="16" fill="#FAFAF7" stroke="#C65F38" stroke-width="7"/>
<text data-step="7" x="905" y="982" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="40" fill="#C65F38">仏教　条件7</text>
<text data-step="7" x="905" y="1050" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="40" fill="#C65F38">争いは望ましいのか</text>
</svg>
