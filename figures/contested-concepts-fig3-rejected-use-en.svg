<rect width="1200" height="1200" fill="#FAFAF7"/>
<text x="60" y="95" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#C65F38">Is Sectarian Dispute a Failure of Buddhism?</text>
<text x="60" y="178" font-family="Noto Serif CJK JP" font-weight="bold" font-size="60" fill="#242321">How to treat a use you reject</text>
<text data-step="1" x="60" y="335" font-family="Noto Sans CJK JP" font-weight="bold" font-size="46" fill="#242321">Lower order</text>
<text data-step="1" x="60" y="388" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#242321">aggressive and</text>
<text data-step="1" x="60" y="432" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#242321">defensive use</text>
