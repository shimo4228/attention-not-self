<text data-step="4" x="60" y="635" font-family="Noto Sans CJK JP" font-weight="bold" font-size="46" fill="#242321">recognition</text>
<text data-step="4" x="60" y="688" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#242321">rival kept as a critic</text>
<rect data-step="4" x="470" y="540" width="220" height="130" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="4" x="580" y="621" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">Own use</text>
