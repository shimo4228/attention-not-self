<text data-step="5" x="805" y="578" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="40" fill="#C65F38">criticism</text>
<text data-step="6" x="60" y="935" font-family="Noto Sans CJK JP" font-weight="bold" font-size="46" fill="#242321">Panjiao</text>
<text data-step="6" x="60" y="992" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#242321">rival housed below</text>
